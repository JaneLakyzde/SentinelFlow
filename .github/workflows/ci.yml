name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [py311, py312, py313]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: v0.73.0

      - name: Check
        run: pixi run --environment ${{ matrix.environment }} check
