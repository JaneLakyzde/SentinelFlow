[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelflow"
version = "0.1.0"
description = "Explainable, extensible security auditing for event sequences"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "JaneLakzde", email = "janelakyzde@gmail.com" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "pyyaml>=6,<7",
    "pyright>=1.1,<2",
]

[project.scripts]
sentinelflow = "sentinelflow.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["sentinelflow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.pyright]
include = ["sentinelflow", "tests"]
exclude = [".pixi", ".git", ".ruff_cache", ".pytest_cache", "dist", "build"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
